# Demo with made-up data. Starts a fake Security Server, the exporter,
# Prometheus and Grafana. Open http://localhost:3000 after `docker compose up`.
services:
  fake-security-server:
    build:
      context: ..
      dockerfile: demo/fake-security-server/Dockerfile

  exporter:
    build: ..
    environment:
      XROAD_SECURITY_SERVER_URL: http://fake-security-server:8080
      XROAD_API_KEY: demo
    ports:
      - "9792:9792"
    depends_on:
      - fake-security-server

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../examples/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - exporter

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/xroad-security-server.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../examples/grafana-dashboard.json:/var/lib/grafana/dashboards/xroad-security-server.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
